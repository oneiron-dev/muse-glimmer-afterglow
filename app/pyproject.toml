[project]
name = "afterglow-app"
version = "0.1.0"
description = "Afterglow day app: Muse Glimmer agent, notes, KV snapshots, web UI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
afterglow-web = "afterglow.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterglow"]
